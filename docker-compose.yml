services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${SEVASETU_SEED_FILE:-./seed/demo-seed.sql}:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env}
      OFFICER_REVIEWER_USERNAME: ${OFFICER_REVIEWER_USERNAME:-}
      OFFICER_REVIEWER_PASSWORD: ${OFFICER_REVIEWER_PASSWORD:-}
      REVIEWER_OTP_USERNAME: ${REVIEWER_OTP_USERNAME:-}
      REVIEWER_OTP_PASSWORD: ${REVIEWER_OTP_PASSWORD:-}
      REVIEWER_OTP_MOBILES: ${REVIEWER_OTP_MOBILES:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in your .env}
      OAUTH_CIMD_ALLOWED_HOSTS: ${OAUTH_CIMD_ALLOWED_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_started
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      
  mcp-citizen:
    build: ./app
    restart: unless-stopped
    command:
      - uvicorn
      - mcp_citizen:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      MCP_JWKS_URL: ${MCP_JWKS_URL:?Set MCP_JWKS_URL}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8011"
    volumes:
      - uploads:/var/sewasetu/uploads:ro
  mcp-officer:
    build: ./app
    restart: unless-stopped

    command:
      - uvicorn
      - mcp_officer:app
      - --host
      - 0.0.0.0
      - --port
      - "8012"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      MCP_JWKS_URL: ${MCP_JWKS_URL:?Set MCP_JWKS_URL}
      OFFICER_ALLOWED_BLOCKS: ${OFFICER_ALLOWED_BLOCKS:?Set officer block names}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8012"
  scheduler:
    build: ./app
    restart: unless-stopped

    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    restart: unless-stopped
    # internal only — reached by the app over the Docker network
    expose:
      - "8025"

  eval-dashboard:
    build: ./app
    restart: unless-stopped
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8030
      - --workers
      - "1"
      - eval_dashboard:app
    environment:
      EVAL_REPORT_DIR: /var/sewasetu/eval-reports
      EVAL_DASHBOARD_USERNAME: ${EVAL_DASHBOARD_USERNAME:?Set evaluation username}
      EVAL_DASHBOARD_PASSWORD: ${EVAL_DASHBOARD_PASSWORD:?Set evaluation password}
    volumes:
      - evalreports:/var/sewasetu/eval-reports:ro
    expose:
      - "8030"

  eval-public:
    build: ./app
    restart: unless-stopped
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8031
      - --workers
      - "1"
      - eval_public:app
    environment:
      EVAL_REPORT_DIR: /var/sewasetu/eval-public
    volumes:
      - evalpublic:/var/sewasetu/eval-public:ro
    expose:
      - "8031"

  # Authenticated real LLM + real MCP tool calls + PostgreSQL verification.
  # Uses test-only private JSON mounted read-only, never baked into Docker image.
  eval-agent:
    build: ./app
    profiles: [evaluation]
    command: ["python", "eval_agent.py", "/run/sevasetu-eval/cases.private.json"]
    environment:
      EVAL_CITIZEN_URL: ${EVAL_CITIZEN_URL:-}
      EVAL_OFFICER_URL: ${EVAL_OFFICER_URL:-}
      EVAL_CITIZEN_A_TOKEN: ${EVAL_CITIZEN_A_TOKEN:-}
      EVAL_CITIZEN_B_TOKEN: ${EVAL_CITIZEN_B_TOKEN:-}
      EVAL_OFFICER_TOKEN: ${EVAL_OFFICER_TOKEN:-}
      EVAL_LLM_BASE_URL: ${EVAL_LLM_BASE_URL:-}
      EVAL_LLM_MODEL: ${EVAL_LLM_MODEL:-}
      EVAL_LLM_API_KEY: ${EVAL_LLM_API_KEY:-}
      EVAL_ALLOW_INTERNAL_LLM_HTTP: ${EVAL_ALLOW_INTERNAL_LLM_HTTP:-}
      EVAL_ENABLE_WRITES: ${EVAL_ENABLE_WRITES:-}
      EVAL_PUBLIC_REPORT_DIR: /var/sewasetu/eval-public
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mcp-citizen:
        condition: service_started
      mcp-officer:
        condition: service_started
    volumes:
      - evalpublic:/var/sewasetu/eval-public
      - ./private-eval:/run/sevasetu-eval:ro

  # Step 5 — Read-only direct MCP smoke evaluation (not an agent conversation).
  eval-runner:
    build: ./app
    profiles:
      - evaluation
    command:
      - python
      - eval_runner.py
    environment:
      EVAL_CITIZEN_URL: ${EVAL_CITIZEN_URL:?Set Citizen MCP URL}
      EVAL_OFFICER_URL: ${EVAL_OFFICER_URL:?Set Officer MCP URL}
      EVAL_CITIZEN_A_TOKEN: ${EVAL_CITIZEN_A_TOKEN:-}
      EVAL_CITIZEN_B_TOKEN: ${EVAL_CITIZEN_B_TOKEN:-}
      EVAL_OFFICER_TOKEN: ${EVAL_OFFICER_TOKEN:-}
      EVAL_CITIZEN_A_APPLICATION_NO: ${EVAL_CITIZEN_A_APPLICATION_NO:-}
      EVAL_CITIZEN_A_EXPECTED_STATUS: ${EVAL_CITIZEN_A_EXPECTED_STATUS:-}
      EVAL_REPORT_DIR: /var/sewasetu/eval-reports
      EVAL_PUBLIC_REPORT_DIR: /var/sewasetu/eval-public
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - evalreports:/var/sewasetu/eval-reports
      - evalpublic:/var/sewasetu/eval-public

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - mcp-citizen
      - mcp-officer
      - eval-public

volumes:
  pgdata:
  uploads:
  applogs:
  evalreports:
  evalpublic:
  caddy_data:
  caddy_config:
