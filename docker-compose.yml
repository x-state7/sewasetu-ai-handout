services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in your .env}
      OAUTH_CIMD_ALLOWED_HOSTS: ${OAUTH_CIMD_ALLOWED_HOSTS:-}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      
  mcp-citizen:
    build: ./app
    command:
      - uvicorn
      - mcp_citizen:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      MCP_JWKS_URL: ${MCP_JWKS_URL:?Set MCP_JWKS_URL}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    depends_on:
      - db
    expose:
      - "8011"

  mcp-officer:
    build: ./app
    command:
      - uvicorn
      - mcp_officer:app
      - --host
      - 0.0.0.0
      - --port
      - "8012"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      MCP_JWKS_URL: ${MCP_JWKS_URL:?Set MCP_JWKS_URL}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    depends_on:
      - db
    expose:
      - "8012"
  scheduler:
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the Docker network
    expose:
      - "8025"

  eval-dashboard:
    build: ./app
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8030
      - --workers
      - "1"
      - eval_dashboard:app
    environment:
      EVAL_REPORT_DIR: /var/sewasetu/eval-reports
      EVAL_DASHBOARD_USERNAME: ${EVAL_DASHBOARD_USERNAME:?Set evaluation username}
      EVAL_DASHBOARD_PASSWORD: ${EVAL_DASHBOARD_PASSWORD:?Set evaluation password}
    volumes:
      - evalreports:/var/sewasetu/eval-reports:ro
    expose:
      - "8030"

  # Step 5 — Deployment-only MCP Evaluation Runner
  eval-runner:
    build: ./app
    profiles:
      - evaluation
    command:
      - python
      - eval_runner.py
    environment:
      EVAL_CITIZEN_URL: ${EVAL_CITIZEN_URL:?Set Citizen MCP URL}
      EVAL_OFFICER_URL: ${EVAL_OFFICER_URL:?Set Officer MCP URL}
      EVAL_CITIZEN_A_TOKEN: ${EVAL_CITIZEN_A_TOKEN:?Set Citizen A token}
      EVAL_CITIZEN_B_TOKEN: ${EVAL_CITIZEN_B_TOKEN:?Set Citizen B token}
      EVAL_OFFICER_TOKEN: ${EVAL_OFFICER_TOKEN:?Set Officer token}
      EVAL_CITIZEN_A_APPLICATION_NO: ${EVAL_CITIZEN_A_APPLICATION_NO:-}
      EVAL_CITIZEN_A_EXPECTED_STATUS: ${EVAL_CITIZEN_A_EXPECTED_STATUS:-}
      EVAL_REPORT_DIR: /var/sewasetu/eval-reports
    volumes:
      - evalreports:/var/sewasetu/eval-reports

volumes:
  pgdata:
  uploads:
  applogs:
  evalreports: