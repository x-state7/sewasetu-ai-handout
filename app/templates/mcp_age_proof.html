
{% extends 'base.html' %}
{% block content %}

<h2>Upload age proof for your AI assistant</h2>

<p>
Only after verifying your phone.
JPG, PNG or PDF, maximum 5 MB.
</p>

<form method="post" enctype="multipart/form-data">
  <input
    type="hidden"
    name="_csrf_token"
    value="{{ csrf_token() }}"
  >

  <input
    type="file"
    name="document"
    accept=".jpg,.jpeg,.png,.pdf"
    required
  >

  <button class="btn" type="submit">
    Upload age proof
  </button>
</form>

{% endblock %}
